services:
  # Настройки по умолчанию для всех сервисов в бандле
  _defaults:
    autowire: true      # Автоматически внедрять зависимости из контейнера
    autoconfigure: true # Автоматически применять теги (например, для событий)
    public: false       # Сервисы приватные (нельзя получить напрямую из контейнера)

  # Регистрируем ВСЕ классы из src/ как сервисы
  Histel951\Dota2Api\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'  # Исключаем конфигурационные классы
      - '../src/Dto/'                   # DTO не должны быть сервисами
      - '../src/Dota2ApiBundle.php'     # Исключаем главный класс бандла

  # Если нужен публичный сервис (чтобы получать через Container::get())
  Histel951\Dota2Api\Service\Dota2Client:
    public: true
    arguments:
      $apiKey: '%dota2_api.api_key%'
      $baseUri: '%dota2_api.base_uri%'
      $timeout: '%dota2_api.timeout%'